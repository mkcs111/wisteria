<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorpblitz</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}.chaos{animation:hue 2s linear infinite;transform-origin:center}.chaos iframe{animation:zoom 2s ease-in-out infinite alternate}@keyframes hue{to{filter:hue-rotate(360deg) saturate(2)}}@keyframes zoom{to{transform:scale(1.08) rotate(1deg)}}.flash{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0 30px,rgba(255,0,200,.2) 30px 60px);animation:flash .25s steps(2) infinite}@keyframes flash{50%{opacity:0;transform:scale(1.2) rotate(5deg)}}</style></head><body><div class="chaos"><iframe src="index.html" title="Wisteria but zorpblitz"></iframe></div><div class="flash"></div></body></html>
